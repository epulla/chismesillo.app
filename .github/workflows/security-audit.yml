name: Security Audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly Monday 06:00 UTC catches new advisories against unchanged code.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit + osv-scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit

      - name: Install osv-scanner
        env:
          OSV_VERSION: v2.3.8
          OSV_SHA256: bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc
        run: |
          curl -fsSL -o /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Run osv-scanner
        run: osv-scanner --lockfile=pnpm-lock.yaml --config=osv-scanner.toml
